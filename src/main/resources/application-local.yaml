spring:
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ioj}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: [health, prometheus]

auth:
  google:
    base-url: ${GOOGLE_BASE_URL}
    client-id: ${GOOGLE_CLIENT_ID}
    redirect-url: ${GOOGLE_REDIRECT_URL}

jwt:
  refresh-time: ${JWT_REFRESH_TIME}
  access-time: ${JWT_ACCESS_TIME}
  prefix: ${JWT_PREFIX}
  header: ${JWT_HEADER}
  secret-key: ${JWT_SECRET_KEY}

item:
  delay: ${ITEM_DELAY:20000}

volume:
  path: ${VOLUME_PATH}

kubernetes:
  url: ${KUBERNETES_URL}
